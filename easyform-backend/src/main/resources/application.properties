
spring.application.name=easyform-backend

# ==========================================
# Neon PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# ==========================================
# Groq API Configuration
# ==========================================
# Keep API credentials on the backend only.
groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}

# ==========================================
# CORS Configuration
# ==========================================
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ==========================================
# Server Error Configuration
# ==========================================
server.error.include-message=always
